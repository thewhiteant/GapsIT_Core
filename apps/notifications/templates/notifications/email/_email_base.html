<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
          <tr>
            <td style="background:linear-gradient(135deg,#4f7cff,#8b5cf6);padding:20px 28px;">
              <span style="color:#ffffff;font-weight:700;font-size:16px;letter-spacing:.3px;">GapsIT Core</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;color:#111827;font-size:14.5px;line-height:1.6;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#f9fafb;border-top:1px solid #eef0f3;color:#9aa1b0;font-size:12px;">
              This is an automated message from GapsIT Core. If you weren't expecting this, you can ignore it.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
