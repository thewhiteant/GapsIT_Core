{% extends "notifications/email/_email_base.html" %}
{% block body %}
<h2 style="margin:0 0 12px;font-size:19px;">{{ subject }}</h2>
<div style="white-space:pre-line;">{{ message }}</div>
<p style="color:#9aa1b0;font-size:12px;margin-top:20px;">Sent by {{ sent_by.get_full_name|default:sent_by.username }} via the GapsIT Core admin panel.</p>
{% endblock %}
